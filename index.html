<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Modern Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-xl p-8">
    <div class="flex flex-col items-center mb-8">
      <div class="w-16 h-16 rounded-2xl bg-black text-white flex items-center justify-center text-2xl font-bold mb-4">
        A
      </div>

      <h1 class="text-3xl font-semibold text-gray-900 text-center">
        Welcome Back
      </h1>

      <p class="text-gray-500 mt-2 text-center">
        Sign in to continue to your account
      </p>
    </div>

    <form class="space-y-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-2">
          Email Address
        </label>

        <input
          type="email"
          placeholder="you@example.com"
          class="w-full rounded-2xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-black transition"
        />
      </div>

      <div>
        <div class="flex items-center justify-between mb-2">
          <label class="block text-sm font-medium text-gray-700">
            Password
          </label>

          <a href="#" class="text-sm text-gray-500 hover:text-black transition">
            Forgot password?
          </a>
        </div>

        <input
          type="password"
          placeholder="••••••••"
          class="w-full rounded-2xl border border-gray-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-black transition"
        />
      </div>

      <button
        type="submit"
        class="w-full bg-black text-white py-3 rounded-2xl font-medium hover:opacity-90 transition"
      >
        Sign In
      </button>
    </form>

    <div class="relative my-6">
      <div class="absolute inset-0 flex items-center">
        <div class="w-full border-t border-gray-200"></div>
      </div>

      <div class="relative flex justify-center text-sm">
        <span class="bg-white px-3 text-gray-400">
          or continue with
        </span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <button class="border border-gray-300 rounded-2xl py-3 font-medium hover:bg-gray-50 transition">
        GitHub
      </button>

      <button class="border border-gray-300 rounded-2xl py-3 font-medium hover:bg-gray-50 transition">
        Microsoft
      </button>
    </div>

    <p class="text-center text-sm text-gray-500 mt-8">
      Don't have an account?
      <a href="#" class="text-black font-medium hover:underline">
        Create account
      </a>
    </p>
  </div>

</body>
</html>
